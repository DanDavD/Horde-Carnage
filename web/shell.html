<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horde Carnage</title>
<style>
  html, body { margin: 0; height: 100%; background: #141218; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  /* The game draws at 1280x720; the page scales it to the largest 16:9 box that fits the window, so a
     laptop screen or a small itch.io frame shows all of it. Emscripten maps the mouse back to game pixels. */
  canvas { display: block; outline: none; width: min(100vw, calc(100vh * 16 / 9)) !important;
           height: auto !important; aspect-ratio: 16 / 9; }
  #status { position: absolute; color: #aaa5b4; font: 18px sans-serif; }
</style>
</head>
<body>
<div id="status">Loading...</div>
<canvas id="canvas" width="1280" height="720" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script>
  // The page around the game: a dark frame the size of the game, and a loading line until it starts.
  var statusLine = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    setStatus: function (text) {
      statusLine.textContent = text;
      statusLine.style.display = text ? 'block' : 'none';
    },
    print: function () {},
    printErr: function () {}
  };
  // Space and the arrow keys would otherwise scroll the page that holds the game, as on itch.io.
  window.addEventListener('keydown', function (event) {
    if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(event.key) >= 0) {
      event.preventDefault();
    }
  });
  // Where the player aims, in game pixels, read by the game every frame (ReadAimPoint). raylib 5.5
  // stops following the mouse in a browser once the game hides the cursor, so the page tracks it.
  var canvas = Module.canvas;
  Module.hordeAim = { x: canvas.width / 2, y: canvas.height / 2 };
  function clamp(value, low, high) { return Math.min(Math.max(value, low), high); }
  function locked() { return document.pointerLockElement === canvas; }
  // The canvas is scaled to fit the window, so page pixels are turned into game pixels.
  function aimAt(event) {
    var box = canvas.getBoundingClientRect();
    Module.hordeAim.x = clamp((event.clientX - box.left) * canvas.width / box.width, 0, canvas.width);
    Module.hordeAim.y = clamp((event.clientY - box.top) * canvas.height / box.height, 0, canvas.height);
  }
  document.addEventListener('mousemove', function (event) {
    if (locked()) {
      // Locked, the mouse only reports how far it moved: the aim point moves by that, inside the game.
      var box = canvas.getBoundingClientRect();
      Module.hordeAim.x = clamp(Module.hordeAim.x + event.movementX * canvas.width / box.width, 0, canvas.width);
      Module.hordeAim.y = clamp(Module.hordeAim.y + event.movementY * canvas.height / box.height, 0, canvas.height);
    } else {
      aimAt(event);
    }
  });
  // A click gives the game the keyboard and locks the pointer to it, so the mouse cannot wander out of
  // the game mid-fight. Esc gives it back; the next click locks it again.
  canvas.addEventListener('mousedown', function (event) {
    canvas.focus();
    if (!locked()) {
      aimAt(event);
      if (canvas.requestPointerLock) { canvas.requestPointerLock(); }
    }
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
