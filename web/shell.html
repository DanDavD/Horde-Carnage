<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horde Carnage</title>
<style>
  html, body { margin: 0; height: 100%; background: #141218; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  /* The game sizes the canvas to the whole page and draws at that resolution, with bars of its own where
     the shape differs, so the page must not scale it. */
  canvas { display: block; outline: none; }
  #status { position: absolute; color: #aaa5b4; font: 18px sans-serif; }
</style>
</head>
<body>
<div id="status">Loading...</div>
<canvas id="canvas" width="1280" height="720" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script>
  // The page around the game: the game over the whole page, and a loading line until it starts.
  var statusLine = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    setStatus: function (text) {
      statusLine.textContent = text;
      statusLine.style.display = text ? 'block' : 'none';
    },
    print: function () {},
    printErr: function () {}
  };
  // Space and the arrow keys would otherwise scroll the page that holds the game, as on itch.io.
  window.addEventListener('keydown', function (event) {
    if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(event.key) >= 0) {
      event.preventDefault();
    }
  });
  // Where the player aims, in canvas pixels, read by the game every frame (ReadAimPoint). raylib 5.5
  // stops following the mouse in a browser once the game hides the cursor, so the page tracks it.
  var canvas = Module.canvas;
  Module.hordeAim = { x: canvas.width / 2, y: canvas.height / 2 };
  function clamp(value, low, high) { return Math.min(Math.max(value, low), high); }
  function locked() { return document.pointerLockElement === canvas; }
  // Page pixels into canvas pixels, in case the browser scales the canvas (a zoomed page).
  function aimAt(event) {
    var box = canvas.getBoundingClientRect();
    Module.hordeAim.x = clamp((event.clientX - box.left) * canvas.width / box.width, 0, canvas.width);
    Module.hordeAim.y = clamp((event.clientY - box.top) * canvas.height / box.height, 0, canvas.height);
  }
  document.addEventListener('mousemove', function (event) {
    if (locked()) {
      // Locked, the mouse only reports how far it moved: the aim point moves by that, times the mouse
      // sensitivity the game sets (Module.hordeSensitivity), inside the game.
      var box = canvas.getBoundingClientRect();
      var speed = Module.hordeSensitivity || 1;
      Module.hordeAim.x = clamp(Module.hordeAim.x + event.movementX * speed * canvas.width / box.width, 0, canvas.width);
      Module.hordeAim.y = clamp(Module.hordeAim.y + event.movementY * speed * canvas.height / box.height, 0, canvas.height);
    } else {
      aimAt(event);
    }
  });
  // While the game is playing (Module.hordeWantsLock, set by SetCursorHidden), a click gives it the
  // keyboard and locks the pointer to it, so the mouse cannot wander out of the game mid-fight. In the
  // menus the pointer stays free, to point at the choices. The lock is also asked for when the button
  // comes up, so the click that resumes a fight locks it as well.
  function lockIfWanted(event) {
    if (Module.hordeWantsLock && !locked()) {
      aimAt(event);
      if (canvas.requestPointerLock) { canvas.requestPointerLock(); }
    }
  }
  // A click also says where the mouse is, so a menu can be clicked without the mouse having moved first.
  canvas.addEventListener('mousedown', function (event) {
    canvas.focus();
    if (!locked()) { aimAt(event); }
    lockIfWanted(event);
  });
  canvas.addEventListener('mouseup', lockIfWanted);
  // Esc frees the pointer and never reaches the game, so a lock lost mid-fight is the game's cue to pause.
  document.addEventListener('pointerlockchange', function () {
    if (!locked() && Module.hordeWantsLock) { Module.hordeLockLost = true; }
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
